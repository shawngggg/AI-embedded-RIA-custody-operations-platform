name: Deploy

# Deploys to Cloud Run once CI passes on main, which is to say after a pull request is merged, then smoke tests the
# live site. The service keeps its own settings (identity, live AI, secrets, scaling): the deploy only ships new code.
# One-time setup: docs/DEPLOY.md, "Automatic deploys from GitHub". Run it by hand from the Actions tab if needed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT: ria-custody-demo
  REGION: us-central1
  SERVICE: ria-custody
  URL: https://ria-custody-1638463558.us-central1.run.app

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # lets the job prove to Google Cloud that it's this repository's main branch
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sign in to Google Cloud (workload identity federation, no key)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: projects/1638463558/locations/global/workloadIdentityPools/github/providers/github
          service_account: ria-custody-deployer@ria-custody-demo.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy the new code (the service's settings stay as they are)
        run: |
          # On failure the error goes into an annotation and the job summary, which the GitHub API can read
          set +e
          gcloud run deploy "$SERVICE" --source . --region "$REGION" --project "$PROJECT" --quiet 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E "ERROR|denied|Permission|permission" deploy.log | tail -5 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Deploy failed::${msg:-$(tail -c 900 deploy.log | tr '\n' ' ')}"
            { echo "### Deploy failed"; echo '```'; tail -40 deploy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Which revision is serving
        id: revision
        run: |
          echo "name=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" \
            --format='value(status.latestReadyRevisionName)')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Smoke test the live site
        run: python tools/smoke_test.py "$URL" --revision "${{ steps.revision.outputs.name }}"
