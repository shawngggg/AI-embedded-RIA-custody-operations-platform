name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  engine-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: mvp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Onboarding engine tests
        run: python -m pytest onboarding -q
      - name: API tests on SQLite
        run: python -m pytest app/tests -q
      - name: API tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/mvp_test
        run: python -m pytest app/tests -q
      - name: Migrations match the data model
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/mvp_test
        run: |
          psql postgresql://app:app@localhost:5432/mvp_test -c "drop schema public cascade; create schema public;"
          alembic upgrade head
          alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
